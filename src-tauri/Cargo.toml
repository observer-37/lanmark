[package]
name = "lanmark"
version = "0.1.0"
description = "Lanmark — LAN-first markdown notes"
authors = ["observer-37"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lanmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
tauri-plugin-dialog = "2.7.3"
base64 = "0.23.1"
# M2 同步：手机端 axum 服务器 + 桌面端 HTTP 客户端 + mDNS 发现
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
mdns-sd = "0.21"
tauri-plugin-log = "2.9.1"
log = "0.4.34"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
base64 = "0.23.1"
tempfile = "3.27.0"
