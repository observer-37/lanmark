name: release

on:
  push:
    tags:
      - 'v*'

# 仓库默认 GITHUB_TOKEN 为只读；上传 release 资产需要 contents:write
# （只读默认下允许按 workflow 提权，最小授权）
permissions:
  contents: write

# 构建失败不应留下半成品 release：release 正文先由 gh release create 建好，
# 产物上传失败时 release 页仍只有说明，不误导下载。
jobs:
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      # 只发原生二进制（AppImage 有 Intel Arc 兼容性问题）；deb/AppImage 不进 release（2026-09-18 定）
      - run: pnpm tauri build --no-bundle
      - name: 打包原生二进制
        run: tar -czf lanmark-linux-x64.tar.gz -C src-tauri/target/release lanmark
      - uses: softprops/action-gh-release@v2
        with:
          files: lanmark-linux-x64.tar.gz
          fail_on_unmatched_files: true

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # 只发 NSIS 安装包；msi 不进 release（2026-09-18 定）
      - run: pnpm tauri build --bundles nsis
      - uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Resolve NDK path (取最高版本)
        run: echo "NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n1)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      # gen/android 已提交（含 buildToolsVersion 钉 34.0.0），无需再 init
      - name: Build debug APK (arm64, debug 签名可直接安装)
        run: pnpm tauri android build --debug --apk --target aarch64
      - name: 重命名为 release 资产名
        run: mv src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk lanmark-android-aarch64.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: lanmark-android-aarch64.apk
          fail_on_unmatched_files: true
